# ======================================
# TravelVista Spring Boot Configuration
# ======================================

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL - Railway
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:TravelVistaSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!2024}
jwt.expiration=${JWT_EXPIRATION:28800000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# ======================================
# Email (SMTP)
# ======================================
# NOTE: Railway env vars in the SPRING_MAIL_* form (SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED)
# override these automatically via Spring relaxed binding.
# The MAIL_* variables below are a secondary/legacy way to set the same values.
# Never commit real credentials — set them as Railway environment variables.
#
# app.mail.dev-mode: true = log emails instead of sending (local dev only).
# On Railway this MUST be false or unset, or OTP emails will never be delivered.
app.mail.dev-mode=${MAIL_DEV_MODE:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP flags — overridable by SPRING_MAIL_PROPERTIES_MAIL_SMTP_* env vars
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Timeouts so a broken SMTP connection fails fast instead of hanging the HTTP request
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}

# Default From address for OTP emails (falls back to the SMTP username)
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
